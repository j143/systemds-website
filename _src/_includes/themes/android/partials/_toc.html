<aside class="table-of-contents" id="table-of-contents" role="navigation" aria-label="Table of contents">
  <div class="toc-content">
    <div class="toc-header">
      <h3 class="toc-title">On this page</h3>
    </div>
    
    <nav class="toc-nav" data-toc-nav>
      <ul class="toc-list" id="toc-list" data-toc-list>
        <!-- TOC items will be generated by JavaScript -->
      </ul>
    </nav>
    
    <!-- Progress indicator -->
    <div class="toc-progress" data-toc-progress>
      <div class="toc-progress-bar" data-toc-progress-bar></div>
    </div>
  </div>
</aside>

<!-- JavaScript to generate TOC -->
<script>
  document.addEventListener('DOMContentLoaded', function() {
    const tocList = document.querySelector('[data-toc-list]');
    const tocNav = document.querySelector('[data-toc-nav]');
    const progressBar = document.querySelector('[data-toc-progress-bar]');
    
    if (!tocList) return;
    
    // Find all headings in the content
    const content = document.querySelector('.content') || document.querySelector('main');
    if (!content) return;
    
    const headings = content.querySelectorAll('h1, h2, h3, h4, h5, h6');
    if (headings.length === 0) {
      // Hide TOC if no headings found
      document.querySelector('.table-of-contents').style.display = 'none';
      return;
    }
    
    // Generate TOC items
    headings.forEach((heading, index) => {
      // Create an ID if the heading doesn't have one
      if (!heading.id) {
        heading.id = heading.textContent
          .toLowerCase()
          .replace(/[^\w\s-]/g, '')
          .replace(/\s+/g, '-')
          .replace(/^-+|-+$/g, '');
      }
      
      // Add anchor link to heading
      const anchor = document.createElement('a');
      anchor.href = '#' + heading.id;
      anchor.className = 'heading-anchor';
      anchor.innerHTML = '<span class="material-icons">link</span>';
      anchor.setAttribute('aria-label', 'Link to this section');
      heading.appendChild(anchor);
      
      // Create TOC item
      const li = document.createElement('li');
      li.className = `toc-item toc-level-${heading.tagName.toLowerCase()}`;
      
      const link = document.createElement('a');
      link.href = '#' + heading.id;
      link.className = 'toc-link';
      link.textContent = heading.textContent.replace('link', '').trim();
      link.setAttribute('data-heading-id', heading.id);
      
      li.appendChild(link);
      tocList.appendChild(li);
    });
    
    // Scroll spy functionality
    let currentActiveLink = null;
    
    function updateActiveLink() {
      const scrollPosition = window.scrollY + 100; // Offset for header
      let activeHeading = null;
      
      headings.forEach(heading => {
        if (heading.offsetTop <= scrollPosition) {
          activeHeading = heading;
        }
      });
      
      // Remove active class from all links
      tocList.querySelectorAll('.toc-link').forEach(link => {
        link.classList.remove('active');
      });
      
      // Add active class to current link
      if (activeHeading) {
        const activeLink = tocList.querySelector(`[data-heading-id="${activeHeading.id}"]`);
        if (activeLink) {
          activeLink.classList.add('active');
          currentActiveLink = activeLink;
        }
      }
      
      // Update progress bar
      if (progressBar) {
        const scrollPercent = Math.min(
          (scrollPosition / (document.documentElement.scrollHeight - window.innerHeight)) * 100,
          100
        );
        progressBar.style.width = scrollPercent + '%';
      }
    }
    
    // Smooth scrolling for TOC links
    tocList.addEventListener('click', function(e) {
      if (e.target.classList.contains('toc-link')) {
        e.preventDefault();
        const targetId = e.target.getAttribute('href').substring(1);
        const targetElement = document.getElementById(targetId);
        
        if (targetElement) {
          const headerHeight = document.querySelector('.app-header').offsetHeight;
          const targetPosition = targetElement.offsetTop - headerHeight - 20;
          
          window.scrollTo({
            top: targetPosition,
            behavior: 'smooth'
          });
        }
      }
    });
    
    // Update active link on scroll
    let scrollTimeout;
    window.addEventListener('scroll', function() {
      if (scrollTimeout) {
        clearTimeout(scrollTimeout);
      }
      scrollTimeout = setTimeout(updateActiveLink, 10);
    });
    
    // Initial update
    updateActiveLink();
  });
</script>
